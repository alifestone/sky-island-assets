<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>空中之島</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="status"></div>
    <div id="hotbar"></div>
    <div id="fps"></div>
    <div id="net"></div>
  </div>

  <div id="crafting" class="hidden">
    <div class="card">
      <h2>合成</h2>
      <p id="table-hint" class="note"></p>
      <div id="recipes"></div>
      <button id="close-crafting">關掉（E）</button>
    </div>
  </div>

  <div id="start">
    <div class="card">
      <h1>空中之島</h1>
      <table>
        <tr><td><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></td><td>走路</td></tr>
        <tr><td><kbd>空白鍵</kbd></td><td>跳</td></tr>
        <tr><td>滑鼠</td><td>轉視角</td></tr>
        <tr><td>按住左鍵</td><td>挖方塊</td></tr>
        <tr><td>走過去</td><td>撿起掉落的方塊</td></tr>
        <tr><td>右鍵</td><td>放方塊</td></tr>
        <tr><td><kbd>Shift</kbd> + <kbd>W</kbd></td><td>衝刺</td></tr>
        <tr><td><kbd>1</kbd>–<kbd>9</kbd>／滾輪</td><td>選方塊欄</td></tr>
        <tr><td><kbd>E</kbd>／右鍵合成台</td><td>合成</td></tr>
        <tr><td><kbd>V</kbd></td><td>換視角（第一／第三人稱）</td></tr>
        <tr><td><kbd>R</kbd></td><td>下雨／停雨</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>暫停</td></tr>
      </table>
      <label class="name">名字（多人連線時別人看得到）
        <input id="name" maxlength="16" placeholder="例如：小明" autocomplete="off">
      </label>
      <button id="play">點一下開始</button>
      <p class="note">素材 © 2026 JUNHAO CHEN，CC BY-NC-SA 4.0</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
